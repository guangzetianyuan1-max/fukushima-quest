<style>
  /* 一画面のゲーム。黒地に固定。ホーム画面から開くと全画面になるので、上下の欠け（ノッチ・ホームバー）を避ける */
  :root { --bg: #000000; color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; touch-action: manipulation; }
  body { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  #game { width: 100%; height: 100%; }
</style>

<div id="game"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.90.0/phaser.min.js" integrity="sha512-/tJYyDCrI7hnHWp45P189aOwPa6lTREosRhlxEIqx8skB4A3a3rD3iz4o335SJd4sORqjVHw5y1S2hq4hciwLw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script type="module" src="src/main.js?v=276"></script>
<script>
